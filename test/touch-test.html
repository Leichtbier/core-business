<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><title>Touch-Test</title></head>
<body>
<pre id="out">läuft…</pre>
<iframe id="f" width="900" height="420"></iframe>
<script type="module">
// Tablet/Smartphone (src/touch.js): Steuerkreuz setzt die Richtungen (acht Sektoren, Ruhezone in der Mitte),
// Antippen der Item-Leiste nutzt ein Item, Pause-Knopf, Funkspruch per Antippen, Touch-Modus an/aus.
const log = [];
const ok = (cond, msg) => log.push((cond ? 'OK   ' : 'FAIL ') + msg);
const frame = document.getElementById('f');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const open = (query) => new Promise((resolve) => { frame.onload = () => resolve(); frame.src = '../index.html?dev&' + query; });
const $ = (id) => frame.contentDocument.getElementById(id);
const visible = (id) => !$(id).classList.contains('hidden');
const until = async (cond, ms = 60000) => { const t = performance.now(); while (!cond() && performance.now() - t < ms) await sleep(50); return cond(); };
const W = () => frame.contentWindow;
const ptr = (el, type, x, y) => el.dispatchEvent(new (W().PointerEvent)(type, { bubbles: true, cancelable: true, pointerId: 7, pointerType: 'touch', clientX: x, clientY: y }));
// Finger auf dem Steuerkreuz: (dx, dy) relativ zum Radius
const padAt = (type, dx, dy) => {
  const r = $('touchPad').getBoundingClientRect(), R = r.width / 2;
  ptr($('touchPad'), type, r.left + R + dx * R, r.top + R + dy * R);
};
const dirs = () => { const i = W().ml3d.game.input; return ['left', 'right', 'up', 'down'].filter((k) => i[k]).join('+') || '-'; };

try {
  await open('touch&autostart&give=2');
  await until(() => visible('hud') && W().ml3d?.game);
  ok(frame.contentDocument.body.classList.contains('touch') && $('touchPad').getClientRects().length > 0, '?touch: Steuerung sichtbar');

  // Funkspruch nach dem Abwurf zu Spielbeginn: Antippen vervollständigt den Text, nochmal Antippen schließt
  ok(await until(() => visible('transmission'), 20000), 'Funkspruch nach dem Abwurf');
  await sleep(1200); // Mindestzeit, bevor der Funkspruch auf Eingaben reagiert
  $('transMsg').click();
  ok(visible('transmission'), 'Erstes Antippen: Text vollständig, Funkspruch bleibt offen');
  for (let i = 0; i < 5 && visible('transmission'); i++) { $('transMsg').click(); await sleep(300); }
  ok(!visible('transmission') && !W().ml3d.game.paused, 'Funkspruch per Antippen geschlossen');

  const cases = [
    [[0.8, 0], 'right'], [[-0.8, 0], 'left'], [[0, -0.8], 'up'], [[0, 0.8], 'down'],
    [[0.6, -0.6], 'right+up'], [[-0.6, 0.6], 'left+down'], [[0.8, -0.2], 'right'], [[0.1, 0.1], '-'], [[2, 0], 'right'],
  ];
  padAt('pointerdown', 0, 0);
  ok(dirs() === '-' && $('touchPad').classList.contains('held'), 'Finger in der Mitte: keine Richtung');
  for (const [[dx, dy], want] of cases) {
    padAt('pointermove', dx, dy);
    ok(dirs() === want, `Finger bei (${dx}, ${dy}): ${dirs()}` + (dirs() === want ? '' : ' statt ' + want));
  }
  ok($('touchPad').querySelector('.right').classList.contains('on'), 'Pfeil der aktiven Richtung leuchtet');
  padAt('pointerup', 2, 0);
  ok(dirs() === '-' && !$('touchPad').classList.contains('held'), 'Loslassen: Pod ruht');

  // Item antippen: Reservetank (Feld 0)
  await sleep(1500); // Abklingzeit der Items
  const items = () => [...W().ml3d.game.items];
  const n0 = items()[0];
  ptr($('itemBar').children[0], 'pointerdown', 0, 0);
  ok(items()[0] === n0 - 1, `Item-Feld antippen nutzt das Item (${n0} → ${items()[0]})`);

  // Pause: Steuerkreuz wirkt nicht, solange das Menü offen ist
  $('touchPause').click();
  ok(visible('pauseScreen'), 'Pause-Knopf öffnet die Pause');
  padAt('pointerdown', 0.8, 0);
  ok(dirs() === '-', 'Steuerkreuz während der Pause ohne Wirkung');
  padAt('pointerup', 0.8, 0);
  $('resumeBtn').click();
  ok(!visible('pauseScreen'), 'Weiter');

  // Tastatur blendet die Touch-Steuerung aus, Berührung wieder ein (ohne ?touch)
  await open('autostart');
  await until(() => visible('hud') && W().ml3d?.game);
  const touchOn = () => frame.contentDocument.body.classList.contains('touch');
  ok(!touchOn(), 'Am PC ohne Touch: Steuerung ausgeblendet');
  ptr($('view'), 'pointerdown', 10, 10);
  ok(touchOn(), 'Berührung blendet sie ein');
  W().dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyZ' }));
  ok(!touchOn(), 'Taste blendet sie wieder aus');
} catch (e) {
  log.push('EXCEPTION ' + e.stack);
}
document.getElementById('out').textContent = log.join('\n');
frame.remove();
</script>
</body>
</html>
