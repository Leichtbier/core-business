<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><title>Lautstärke-Test</title></head>
<body>
<pre id="out">läuft…</pre>
<iframe id="f" width="1100" height="760"></iframe>
<script type="module">
// Lautstärke unten rechts: Regler erst nach Klick aufs Symbol, Musik und Effekte getrennt, Stummschalter,
// Taste N, Esc und Klick daneben schließen, Werte bleiben gespeichert (ein vorhandener Stand wird gesichert).
const log = [];
const ok = (cond, msg) => log.push((cond ? 'OK   ' : 'FAIL ') + msg);
const frame = document.getElementById('f');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const open = (query) => new Promise((resolve) => { frame.onload = () => resolve(); frame.src = '../index.html?dev&' + query; });
const $ = (id) => frame.contentDocument.getElementById(id);
const visible = (id) => !$(id).classList.contains('hidden');
const until = async (cond, ms = 60000) => { const t = performance.now(); while (!cond() && performance.now() - t < ms) await sleep(50); return cond(); };
const key = async (code) => { frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown', { code, bubbles: true })); await sleep(30); };
const slide = (k, v) => { const s = $(k + 'Vol'); s.value = v; s.dispatchEvent(new Event('input', { bubbles: true })); };
const KEY = 'ml3d.volume';
const backup = localStorage.getItem(KEY);

try {
  localStorage.removeItem(KEY);
  await open('lang=de');
  await until(() => visible('startScreen'));
  const sfx = () => frame.contentWindow.ml3d.sfx;
  ok(!visible('volPanel'), 'Regler zunächst zugeklappt');
  $('volBtn').click();
  ok(visible('volPanel') && $('volBtn').classList.contains('open'), 'Klick aufs Symbol klappt die Regler auf');
  ok($('musicRow').querySelector('.volName').textContent === 'MUSIK' && $('sfxRow').querySelector('.volName').textContent === 'EFFEKTE',
    'Beschriftung deutsch: MUSIK / EFFEKTE');
  ok($('musicVal').textContent === '100%' && $('sfxVal').textContent === '100%', 'Standard 100 % / 100 %');

  slide('music', 40);
  slide('sfx', 70);
  ok(sfx().musicVolume === 0.4 && sfx().sfxVolume === 0.7, `Regler getrennt: Musik ${sfx().musicVolume}, Effekte ${sfx().sfxVolume}`);
  ok(Math.abs(sfx().musicGain - 0.16) < 1e-9 && Math.abs(sfx().sfxGain - 0.49) < 1e-9, 'Verstärkung quadratisch (0,16 / 0,49)');
  ok($('musicVal').textContent === '40%', 'Anzeige: ' + $('musicVal').textContent);

  $('sfxMute').click();
  ok(sfx().sfxMuted && sfx().sfxGain === 0 && $('sfxRow').classList.contains('silent'), 'Effekte stumm');
  ok($('volBtn').classList.contains('part') && !$('volBtn').classList.contains('silent'), 'Symbol: eine Welle (teilweise stumm)');
  await key('KeyN');
  ok(sfx().musicMuted && $('volBtn').classList.contains('silent'), 'Taste N: Musik stumm, Symbol durchgestrichen');
  await key('KeyN');
  ok(!sfx().musicMuted && sfx().musicVolume === 0.4, 'Taste N: Musik wieder an, Regler unverändert');
  slide('sfx', 60);
  ok(!sfx().sfxMuted && sfx().sfxVolume === 0.6, 'Regler aufdrehen hebt die Stummschaltung auf');
  slide('music', 0);
  ok($('musicRow').classList.contains('silent') && $('volBtn').classList.contains('part'), 'Regler auf 0 gilt als stumm');
  $('musicMute').click(); $('musicMute').click();
  ok(!sfx().musicMuted && sfx().musicVolume === 0.5,'Stummschalter bei 0: Musik wieder hörbar (' + sfx().musicVolume + ')');
  slide('music', 40);

  await key('Escape');
  ok(!visible('volPanel') && visible('startScreen'), 'Esc klappt die Regler zu, das Startmenü bleibt');
  $('volBtn').click();
  frame.contentDocument.getElementById('view').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
  ok(!visible('volPanel'), 'Klick daneben klappt die Regler zu');

  // Gespeichert: nach dem Neuladen gelten die Werte wieder
  await open('lang=en');
  await until(() => visible('startScreen'));
  ok(frame.contentWindow.ml3d.sfx.musicVolume === 0.4 && frame.contentWindow.ml3d.sfx.sfxVolume === 0.6, 'Nach Neuladen: 40 % / 60 %');
  ok($('musicVal').textContent === '40%' && $('sfxRow').querySelector('.volName').textContent === 'EFFECTS', 'Regler und englische Beschriftung stimmen');
} catch (e) {
  log.push('EXCEPTION ' + e.stack);
}
if (backup === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, backup);
document.getElementById('out').textContent = log.join('\n');
frame.remove();
</script>
</body>
</html>
